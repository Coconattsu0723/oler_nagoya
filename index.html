<script>
    const hamburger = document.querySelector('.hamburger');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuClose = document.getElementById('menuClose');
    const menuLinks = document.querySelectorAll('.menu_nav a');


    hamburger.addEventListener('click', () => {
        menuOverlay.classList.add('is-active');
    });

    menuClose.addEventListener('click', () => {
        menuOverlay.classList.remove('is-active');
    });

    menuLinks.forEach(link => {
        link.addEventListener('click', () =>{
            menuOverlay.classList.remove('is-active');
        });
    });

// ギャラリーモーダルの制御
    const galleryLinks = document.querySelectorAll('.gallery-link');
    const modal = document.getElementById('gallery-modal');
    const modalImg = document.getElementById('modal-img');

    galleryLinks.forEach(link => {
        link.addEventListener('click',(e) => {
            e.preventDefault();
            const imageSrc = link.getAttribute('href');
            modalImg.setAttribute('src', imageSrc);
            modal.classList.add('is-show');
        });
    });

    modal.addEventListener('click',()=>{
        modal.classList.remove('is-show');
    });

    const modalClose = document.querySelector('.modal-close');
    modalClose.addEventListener('click',(e) => {
        e.stopPropagation();
        modal.classList.remove('is-show');
    });

// spaceセクションのギャラリー切り替え処理
const spaceThumbs=document.querySelectorAll('.space_bottom img');
const mainSpaceImg=document.getElementById('main-space-img');
const prevSpaceBtn=document.querySelector('.prev_btn');
const nextSpaceBtn=document.querySelector('.next_btn');

let currentSpaceIndex=-1;

function updateSpaceImage(index){
    spaceThumbs.forEach(thumb=>thumb.classList.remove('is-active'));

    if (index>=0 && index<spaceThumbs.length){
        spaceThumbs[index].classList.add('is-active');
        const newSrc=spaceThumbs[index].getAttribute('src');
        mainSpaceImg.setAttribute('src',newSrc);
        currentSpaceIndex=index;
    }
    }

    nextSpaceBtn.addEventListener('click',()=>{
        let nextIndex=currentSpaceIndex+1;
        if (nextIndex>=spaceThumbs.length||nextIndex<0){
            nextIndex=0;
        }
        updateSpaceImage(nextIndex);
    })

    prevSpaceBtn.addEventListener('click',()=>{
        let prevIndex=currentSpaceIndex-1;
        if(prevIndex<0){
            prevIndex=spaceThumbs.length-1;
        }
        updateSpaceImage(prevIndex);
    })

    spaceThumbs.forEach((thumb,index)=>{
        thumb.addEventListener('click',()=>{
            updateSpaceImage(index);
        });
    });
</script>
